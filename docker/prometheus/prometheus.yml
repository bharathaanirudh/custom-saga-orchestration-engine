global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the example app's actuator/prometheus endpoint.
  # Add your own service here when running the engine in your own deployment.
  - job_name: 'saga-orchestrator-example'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
        labels:
          service: saga-orchestrator-example
